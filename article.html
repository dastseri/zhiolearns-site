<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="ZhioLearns articles for parents of children ages 3–6." />
  <link rel="icon" type="image/png" href="img/zhiolearns-logo.png" />
  <title>Article — ZhioLearns</title>
  <style>
    :root{
      --paper:#ffffff; --ink:#18333a; --muted:#5a6f73; --line:#e3ece7;
      --teal:#087f79; --coral:#ef694f; --sun:#ffc93c; --soft:#f2f8f4;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);
      font-family:"Atkinson Hyperlegible",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
      line-height:1.8;-webkit-font-smoothing:antialiased}
    html[lang="fa"] body{font-family:"Vazirmatn","Atkinson Hyperlegible",Tahoma,sans-serif}
    a{color:var(--teal)}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:14px clamp(16px,4vw,48px);border-bottom:1px solid var(--line);
      position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);z-index:10}
    .brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:22px}
    .brand img{width:42px;height:42px;border-radius:50%}
    .topnav{display:flex;align-items:center;gap:8px}
    .tbtn{border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;
      padding:9px 16px;font-weight:700;text-decoration:none;font-size:15px;cursor:pointer;font-family:inherit}
    .tbtn:hover{background:var(--soft)}
    .wrap{max-width:720px;margin:0 auto;padding:44px 20px 90px}
    .back{display:inline-block;margin-bottom:26px;font-weight:700;text-decoration:none}
    .back:hover{text-decoration:underline}
    article h1{font-size:clamp(28px,4.6vw,40px);line-height:1.3;margin:0 0 10px}
    .date{color:var(--muted);font-size:15px;margin-bottom:28px}
    .body{font-size:18px}
    .body p{margin:0 0 1.2em}
    .body h2{font-size:24px;margin:1.8em 0 .6em;line-height:1.35}
    .body h3{font-size:20px;margin:1.6em 0 .5em}
    .body ul,.body ol{margin:0 0 1.2em;padding-inline-start:1.4em}
    .body li{margin-bottom:.45em}
    .body strong{color:var(--ink)}
    .loading,.empty,.errbox{text-align:center;color:var(--muted);padding:50px 16px;font-size:17px}
    .errbox{background:#fdecea;color:#8f2b1d;border:2px solid #f3b3a6;border-radius:14px;font-weight:700}
    .foot{border-top:1px solid var(--line);padding:26px 20px;text-align:center;color:var(--muted);font-size:14px}
    .foot a{color:var(--teal);text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html" aria-label="ZhioLearns home">
      <img src="img/zhiolearns-logo.png" alt="Romy the raccoon" /><span><span style="color:var(--coral)">Zhio</span><span style="color:var(--teal)">Learns</span></span>
    </a>
    <nav class="topnav">
      <button class="tbtn" id="btn-lang" type="button" aria-label="Language / زبان">🌐 فارسی</button>
      <a class="tbtn" href="articles.html" data-i18n="nav_articles">Articles</a>
    </nav>
  </header>

  <main class="wrap">
    <a class="back" href="articles.html" data-i18n="back">← All articles</a>
    <div class="loading" id="loading" data-i18n="loading">Loading article…</div>
    <div class="errbox" id="err" hidden></div>
    <article id="article" hidden>
      <h1 id="a-title"></h1>
      <div class="date" id="a-date"></div>
      <div class="body" id="a-body"></div>
    </article>
    <div class="empty" id="notfound" hidden>
      <p data-i18n="notfound">This article could not be found. It may have been removed.</p>
      <p><a href="articles.html" data-i18n="back2">Back to all articles</a></p>
    </div>
  </main>

  <footer class="foot">
    <span data-i18n="foot">© ZhioLearns — playful early learning for ages 3–6.</span>
    <a href="index.html" data-i18n="nav_home">Back to the site</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    'use strict';
    /* Article reader — fetches one published article by slug (RLS enforces it). */
    var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    var STRINGS = {
      en: {
        dir: 'ltr', lang: 'en', langBtn: '🌐 فارسی',
        nav_articles: 'Articles', back: '← All articles', back2: 'Back to all articles',
        loading: 'Loading article…', notfound: 'This article could not be found. It may have been removed.',
        err: 'Could not load this article. Please try again later.',
        foot: '© ZhioLearns — playful early learning for ages 3–6. ', nav_home: 'Back to the site'
      },
      fa: {
        dir: 'rtl', lang: 'fa', langBtn: '🌐 EN',
        nav_articles: 'مقالات', back: '→ همه مقاله‌ها', back2: 'بازگشت به همه مقاله‌ها',
        loading: 'در حال بارگذاری مقاله…', notfound: 'این مقاله پیدا نشد. ممکن است حذف شده باشد.',
        err: 'بارگذاری این مقاله ممکن نشد. لطفاً بعداً تلاش کنید.',
        foot: '© ژیولرنز — یادگیری شاد برای ۳ تا ۶ ساله‌ها. ', nav_home: 'بازگشت به سایت'
      }
    };
    var LANG_KEY = 'zlg_articles_lang';
    var LANG = 'en';
    try { LANG = localStorage.getItem(LANG_KEY) || 'en'; } catch (e) {}
    if (LANG !== 'fa' && LANG !== 'en') LANG = 'en';

    function t(k) { return STRINGS[LANG][k] != null ? STRINGS[LANG][k] : (STRINGS.en[k] || k); }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function setMetaDescription(text) {
      var m = document.querySelector('meta[name="description"]');
      if (m) m.setAttribute('content', text);
    }
    function applyLang() {
      document.documentElement.lang = STRINGS[LANG].lang;
      document.documentElement.dir = STRINGS[LANG].dir;
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        el.textContent = t(el.getAttribute('data-i18n'));
      });
      document.getElementById('btn-lang').textContent = t('langBtn');
    }
    function setLang(l) {
      LANG = (l === 'fa') ? 'fa' : 'en';
      try { localStorage.setItem(LANG_KEY, LANG); } catch (e) {}
      applyLang();
      render();
    }
    document.getElementById('btn-lang').addEventListener('click', function () {
      setLang(LANG === 'fa' ? 'en' : 'fa');
    });

    var article = null;
    function fmtDate(iso) {
      try {
        return new Date(iso).toLocaleDateString(LANG === 'fa' ? 'fa-IR' : 'en-CA', { dateStyle: 'long' });
      } catch (e) { return ''; }
    }
    function render() {
      if (!article) return;
      document.title = article.title + ' — ZhioLearns';
      setMetaDescription(article.excerpt || article.title);
      document.getElementById('a-title').textContent = article.title;
      document.getElementById('a-date').textContent = fmtDate(article.created_at);
      /* body_html is admin-authored (never child or visitor input) — innerHTML is intended. */
      document.getElementById('a-body').innerHTML = article.body_html;
      /* If the article itself is Persian, render the article in RTL regardless of UI language. */
      document.getElementById('article').setAttribute('dir', article.lang === 'fa' ? 'rtl' : 'ltr');
      document.getElementById('article').hidden = false;
    }

    async function load() {
      var loading = document.getElementById('loading');
      var err = document.getElementById('err');
      var notfound = document.getElementById('notfound');
      loading.textContent = t('loading');
      var slug = new URLSearchParams(location.search).get('slug') || '';
      slug = slug.trim().toLowerCase();
      if (!slug) { loading.hidden = true; notfound.hidden = false; return; }
      try {
        var res = await supabase.from('articles')
          .select('slug,title,excerpt,body_html,lang,created_at')
          .eq('slug', slug)
          .eq('published', true)
          .single();
        loading.hidden = true;
        if (res.error || !res.data) { notfound.hidden = false; return; }
        article = res.data;
        render();
      } catch (e) {
        loading.hidden = true;
        err.hidden = false;
        err.textContent = t('err');
      }
    }

    applyLang();
    load();
  </script>
</body>
</html>
